server:
  port: 8091
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/authdb
    username: authuser
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
security:
  jwt:
    issuer: txn-routing-auth
    ttlSeconds: 3600
    # RSA keypair for signing JWT (private) and publish JWK later if needed
    privateKeyPem: |
      -----BEGIN RSA PRIVATE KEY-----
      
      -----END RSA PRIVATE KEY-----