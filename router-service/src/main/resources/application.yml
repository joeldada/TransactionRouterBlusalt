server:
  port: 8093
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/routerdb
    username: routeruser
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
security:
  jwt:
    issuer: txn-routing-auth
    publicKeyPem: |
      -----BEGIN PUBLIC KEY-----
      
      -----END PUBLIC KEY-----
crypto:
  baseUrl: http://localhost:8092
